<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的报名 · 2026—2027 辣条杯「天外来物」主题赛</title>
<meta name="description" content="查看和修改自己的辣条杯报名。">
<meta name="author" content="TLSTUDIO × TLDOUBLERSTUDIO">
<link rel="canonical" href="https://tlbs.top/me.html">
<link rel="icon" href="assets/img/logo-tlstudio-mark.png">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#ffffff; --bg-2:#f5f5f5; --surface:#ffffff; --surface-2:#eeeeee;
  --line:#e7e7e7; --line-2:#c9c9c9;
  --text:#111111; --muted:#5f5f5f; --dim:#737373;
  --blue:#111111; --cyan:#111111; --violet:#3a3a3a;
  --grad:linear-gradient(120deg,#111111 0%,#3a3a3a 100%);
  --green:#111111; --red:#111111; --amber:#5f5f5f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(760px,92vw);margin:0 auto;padding:34px 0 70px}
header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px}
.brand img{height:26px;width:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.nav ul{display:flex;gap:4px;margin-left:auto;list-style:none}
.nav ul a{display:block;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--text);background:var(--surface-2)}
.kicker{display:inline-flex;align-items:center;gap:9px;font:600 12px/1 ui-monospace,monospace;
  letter-spacing:.2em;color:var(--cyan);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.06);margin-top:30px}
.kicker i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);transform:translateY(.125em)}
h1{font-size:clamp(26px,4.6vw,38px);margin:14px 0 8px;font-weight:600;letter-spacing:-.01em}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:22px}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800}
/* 黑白状态语义：实心=通过 / 黑边描边=拒签 / 浅灰=待审 / 虚线=退出 */
.b-ok{background:#111111;color:#ffffff;border:1px solid #111111}
.b-rej{background:#ffffff;color:#111111;border:1.5px solid #111111}
.b-pend{background:#f0f0f0;color:#5f5f5f;border:1px solid #d5d5d5}
.b-out{background:#fafafa;color:#737373;border:1px dashed #c9c9c9}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg-2);border:1px dashed var(--line-2);border-radius:12px;
  padding:14px 18px;margin:12px 0 18px}
.codebox .lbl{font-size:12px;color:var(--dim);font-weight:700}
.codebox .v{font:800 26px/1.2 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.16em;color:var(--cyan)}
.mini{padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f.full{grid-column:1 / -1}
label{font-size:13px;font-weight:700;color:#3a3a3a}
input[type=text],textarea,select{background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:10px;padding:11px 13px;color:var(--text);font-size:15px;
  font-family:inherit;outline:none;width:100%}
textarea{min-height:78px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
.save{width:100%;padding:12px;border:none;border-radius:11px;background:var(--grad);
  color:#ffffff;font-size:15px;font-weight:800;cursor:pointer}
.save:disabled{opacity:.6;cursor:not-allowed}
.quit{width:100%;margin-top:10px;padding:11px;border:1.5px solid #111111;
  border-radius:11px;background:#ffffff;color:#111111;font-size:14px;
  font-weight:800;cursor:pointer}
.quit:hover{background:#f0f0f0}
.rejoin{width:100%;padding:12px;border:1px solid #111111;border-radius:11px;
  background:#111111;color:#ffffff;font-size:15px;font-weight:800;cursor:pointer}
.rejoin:hover{background:#3a3a3a;border-color:#3a3a3a}
.tip{color:var(--dim);font-size:12.5px;margin-top:10px;line-height:1.8}
.tip a{color:#111111;text-decoration:underline}
.note{background:#fafafa;border:1px solid #c9c9c9;
  border-radius:10px;padding:11px 14px;color:#5f5f5f;font-size:13.5px;margin-bottom:14px}
.note.ok{background:#f0f0f0;border-color:#111111;color:#111111}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.msg{display:none;padding:14px 18px;border-radius:11px;font-size:14.5px;margin-bottom:16px}
.msg.on{display:block}
.msg.ok{background:#111111;color:#ffffff}
.msg.err{background:#fafafa;border:1.5px solid #111111;color:#111111}
.msg.wait{background:#f0f0f0;color:#5f5f5f}
.card.foot{text-align:center;color:var(--dim);font-size:12.5px}
@media (max-width:640px){.nav ul{display:none}.grid{grid-template-columns:1fr}}


/* ===== nav 修复（2026-11 起各页统一） =====
   症状：窗口一窄，品牌被导航挤成四行（天外来物 / 2026—2027 / LATIAO / CUP），
         导航自己也折成两排，而 .nav-in 又写死 62px 高 —— 溢出的字直接压到首屏上。
   做法：品牌固定成一块、不缩不换行；导航不换行也不横滑（横滑会把「报名」藏到屏幕外），
         放不下就整体折到品牌下一行；头部高度改成 min-height，永远不会顶穿下面的内容。 */
.nav-in{height:auto;min-height:62px;flex-wrap:nowrap;align-items:center;padding:9px 0}
.brand{flex:0 0 auto;white-space:nowrap;line-height:1.15}
.brand img{flex:0 0 auto}
.brand span{white-space:nowrap}
.brand small{white-space:nowrap;margin-top:2px;font-size:10.5px;letter-spacing:.08em}
.nav ul{flex-wrap:nowrap;min-width:0;justify-content:flex-end}
.nav ul li{flex:0 0 auto}
.nav ul a{white-space:nowrap}
@media (max-width:1100px){
  .nav-in{gap:8px}
  .nav ul{gap:2px}
  .nav ul a{padding:7px 9px;font-size:13px}
  .brand span{font-size:14px}
}
@media (max-width:900px){
  .nav ul a{padding:6px 7px;font-size:12.5px}
  .brand span{font-size:13px}
  .brand img{height:22px}
  .brand small{font-size:9.5px;letter-spacing:.04em}
}
/* ★ 手机上：品牌第一行，导航整体折到第二行 —— 一项不藏、一格不滑 */
@media (max-width:780px){
  .nav-in{flex-wrap:wrap;min-height:0;padding:8px 0 6px;gap:0 8px;row-gap:4px}
  .brand{padding:2px 0}
  .brand span{font-size:13.5px}
  .brand small{display:none}
  /* 以前这里（640px）是 display:none，手机等于没导航，改回可见 */
  .nav ul{display:flex;flex:1 1 100%;margin-left:0;justify-content:flex-start;
          flex-wrap:wrap;gap:0}
  .nav ul a{padding:6px 7px;font-size:12.5px}
}
@media (max-width:420px){
  .brand span{font-size:12.5px}
  .brand img{height:20px}
  .nav ul a{padding:5px 5px;font-size:12px}
}
/* 统一标题字重 */
h1,h2,h3,h4{font-weight:600}
/* 状态图标统一尺寸 */
.si{width:1em;height:1em;vertical-align:-.14em;flex:0 0 auto;stroke-width:1.7}
/* 导航统一：当前页高亮 / 报名 CTA */
.nav ul a.cta{color:var(--text);font-weight:700}
.nav ul a.on{color:var(--text);background:var(--surface-2)}
header.nav .nav-in{width:min(1180px,92vw);margin:0 auto}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html">
      <img src="assets/img/logo-tlstudio-cut.png" alt="TLSTUDIO">
      <span>辣条杯 · 天外来物<small>2026—2027 LATIAO CUP</small></span>
    </a>
    <ul>
      <li><a href="index.html#about">赛事</a></li>
      <li><a href="index.html#rules">规则</a></li>
      <li><a href="index.html#tasks">任务</a></li>
      <li><a href="index.html#score">计分</a></li>
      <li><a href="index.html#download">下载</a></li>
      <li><a href="map.html">每日地图</a></li>
      <li><a href="query.html">查结果</a></li>
      <li><a href="login.html" class="on">我的报名</a></li>
      <li><a href="signup.html" class="cta">报名 →</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  <span class="kicker"><i></i>MY TEAM · 我的报名</span>
  <h1>我的<span>报名</span></h1>
  <div id="box">
    <div class="bar">
      <span class="sub" id="who">正在读取…</span>
      <button class="mini" id="refresh">刷新</button>
      <button class="mini" id="logout">退出登录</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="list"></div>
    <div class="card" id="closeBox" style="border-color:#c9c9c9">
      <h2 style="color:#111111">注销账号</h2>
      <div class="sub">把你这个联系方式名下的<b>全部</b>报名一起删除（联系方式、选手、教练等资料全部清除）并退出登录。<br>
        <b>不可恢复</b> —— 只是某一支队伍不参加的话，用卡片里的「退出比赛」就够了。</div>
      <button class="quit" onclick="delAccount()">注销账号并清空我的报名数据</button>
    </div>
  </div>
  <p class="card foot">TLSTUDIO × TLDOUBLERSTUDIO 主办 · 结果以组委会通知为准</p>
</div>

<script>
// ★ 基准必须是站点根，别写成 ".../latiao"（会拼成 /latiao/latiao/me → 404）
const API = "https://api.tlstudio.cn/latiao";
const $ = id => document.getElementById(id);

function msg(kind, text){
  const m = $("msg");
  if(!text){ m.className = "msg"; m.innerHTML = ""; return; }
  m.className = "msg on " + kind;
  m.innerHTML = String(text).replace(/\n/g, "<br>");
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function token(){ try{ return localStorage.getItem("lt_token") || ""; }catch(e){ return ""; } }
function fmt(ts){
  if(!ts) return "";
  const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function badge(st){
  if(st === "ok") return '<span class="badge b-ok">已通过</span>';
  if(st === "rej") return '<span class="badge b-rej">未通过</span>';
  if(st === "out") return '<span class="badge b-out">已退出</span>';
  return '<span class="badge b-pend">审核中</span>';
}

async function api(path, body){
  const r = await fetch(API + path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
    cache: "no-store"
  });
  let j = {};
  try{ j = await r.json(); }catch(e){ j = {ok:false, error:"返回格式不对"}; }
  return {status: r.status, j: j};
}

function cardHtml(it){
  const rej = it.st === "rej"
    ? '<div class="note">未通过' + (it.rejNote ? "：" + esc(it.rejNote) : "") +
      '。改好资料重新提交一次就能再申请。</div>' : "";
  const ok = it.st === "ok"
    ? '<div class="note ok">已通过审核' + (it.approveNote ? "（" + esc(it.approveNote) + "）" : "") + '。</div>' : "";
  const acts = '<button class="save" onclick="save(this)">保存修改</button>' +
               '<button class="quit" onclick="quit(this)">退出比赛</button>';
  return '' +
  '<div class="card" data-id="' + esc(it.id) + '">' +
    '<h2>' + esc(it.team || "（未填队伍名）") + ' ' + badge(it.st) + '</h2>' +
    '<div class="sub">提交于 ' + fmt(it.ts) + ' · 编号 ' + esc(it.id) + '</div>' +
    rej + ok +
    '<div class="codebox">' +
      '<div><div class="lbl">你的报名码</div><div class="v">' + esc(it.code || "——") + '</div></div>' +
      '<button class="mini" onclick="copyCode(this)">复制</button>' +
    '</div>' +
    '<div class="grid">' +
      '<div class="f"><label>选手 1</label><input type="text" class="e" data-k="member1" maxlength="20" value="' + esc(it.member1) + '"></div>' +
      '<div class="f"><label>选手 2</label><input type="text" class="e" data-k="member2" maxlength="20" value="' + esc(it.member2) + '"></div>' +
      '<div class="f"><label>指导教练</label><input type="text" class="e" data-k="coach" maxlength="20" value="' + esc(it.coach) + '"></div>' +
      '<div class="f"><label>器材</label><select class="e" data-k="gear">' +
        '<option value="自备鲸鱼机器人器材"' + (String(it.gear).indexOf("自备") === 0 ? " selected" : "") + '>自备</option>' +
        '<option value="租借鲸鱼机器人器材"' + (String(it.gear).indexOf("租借") === 0 ? " selected" : "") + '>租借</option>' +
      '</select></div>' +
      '<div class="f full"><label>备注</label><textarea class="e" data-k="note" maxlength="200">' + esc(it.note) + '</textarea></div>' +
    '</div>' +
    acts +
    '<div class="tip">队伍名和联系方式要改的话找组委会—— 这两项是判定「是不是同一个人重复报名」的依据，开放改会乱。</div>' +
  '</div>';
}

async function load(){
  msg("wait", "正在读取你的报名…");
  const {status, j} = await api("/me", {token: token()});
  if(!j.ok){
    if(status === 401){
      try{ localStorage.removeItem("lt_token"); }catch(e){}
      $("list").innerHTML = "";
      $("who").textContent = "未登录";
      msg("err", "登录已过期（30 天），请重新登录。<br><a href='login.html' style='color:var(--cyan)'>去登录 →</a>");
      setTimeout(function(){ location.href = "login.html"; }, 2500);
      return;
    }
    msg("err", j.error || "读取失败，稍后再试。");
    return;
  }
  msg("");
  $("who").textContent = "联系方式 " + (j.contact || "") + " · 共 " + (j.count || 0) + " 条报名";
  $("list").innerHTML = (j.items || []).map(cardHtml).join("") ||
    '<div class="card">这个联系方式名下还没有报名。<br><a href="signup.html" style="text-decoration:underline;text-underline-offset:3px">去报名 →</a></div>';
}

async function save(btn){
  const card = btn.closest(".card");
  const id = card.getAttribute("data-id");
  const body = {token: token(), id: id};
  card.querySelectorAll(".e").forEach(function(el){ body[el.getAttribute("data-k")] = el.value; });
  btn.disabled = true; btn.textContent = "保存中…";
  const {status, j} = await api("/me/update", body);
  btn.disabled = false; btn.textContent = "保存修改";
  if(j.ok){
    msg("ok", "已保存。改过资料后组委会可能会重新核对一遍。");
  }else if(status === 401){
    msg("err", "登录已过期，请重新登录。");
  }else{
    msg("err", j.error || "保存失败，稍后再试。");
  }
}

// ★ 退出比赛 = 终局操作：**不可撤销**，整条报名的资料一起清掉。
//   所以确认框必须把后果说死，不能让用户以为还能反悔。
async function quit(btn){
  const card = btn.closest(".card");
  const id = card.getAttribute("data-id");
  const team = (card.querySelector("h2") || {}).textContent || "这支队伍";
  if(!confirm("确定退出比赛？这一步不能反悔。\n\n队伍：" + team.trim() +
      "\n退出后：\n· 这条报名的联系方式、选手、教练等资料会全部清除\n" +
      "· 不能再恢复，想参加只能重新报名（会拿到新的报名码）\n" +
      "· 原来的报名码还能查到「已退出比赛」\n\n确定要退出吗？")) return;
  if(!confirm("最后确认一次：退出后无法恢复，确定退出？")) return;
  let why = "";
  try{ why = (prompt("退出原因（选填）", "") || "").slice(0, 100); }catch(e){ why = ""; }
  btn.disabled = true; btn.textContent = "处理中…";
  const {status, j} = await api("/me/quit", {token: token(), id: id, note: why});
  if(j.ok){ msg("ok", "已退出比赛，报名信息已清除。想再参加请重新报名。"); await load(); }
  else if(status === 401){ msg("err", "登录已过期，请重新登录。"); btn.disabled = false; btn.textContent = "退出比赛"; }
  else{ msg("err", j.error || "操作失败，稍后再试。"); btn.disabled = false; btn.textContent = "退出比赛"; }
}

// 注销账号：这个手机号名下的全部报名一起清掉 + 会话失效。不可恢复。
async function delAccount(){
  if(!confirm("注销账号？这一步不能反悔。\n\n将删除你这个联系方式名下的全部报名：\n" +
      "· 联系方式、选手、教练等资料全部清除\n· 退出登录，想再看要重新用报名码登录\n" +
      "· 想再参加只能重新报名（会拿到新的报名码）\n\n" +
      "只是某一支队伍不参加的话，用卡片里的「退出比赛」，别注销。")) return;
  if(!confirm("最后确认一次：注销后无法恢复，确定注销？")) return;
  const {status, j} = await api("/me/delete", {token: token()});
  if(j.ok){
    try{ localStorage.removeItem("lt_token"); localStorage.removeItem("lt_contact"); }catch(e){}
    location.href = "index.html";
  }else if(status === 401){ msg("err", "登录已过期，请重新登录。"); }
  else{ msg("err", j.error || "操作失败，稍后再试。"); }
}

function copyCode(btn){
  const v = btn.parentNode.querySelector(".v").textContent.trim();
  const done = function(){ btn.textContent = "已复制"; setTimeout(function(){ btn.textContent = "复制"; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(done, function(){ done(); });
  }else{ done(); }
}

$("refresh").addEventListener("click", load);
$("logout").addEventListener("click", async function(){
  await api("/logout", {token: token()});
  try{ localStorage.removeItem("lt_token"); localStorage.removeItem("lt_contact"); }catch(e){}
  location.href = "login.html";
});
window.save = save; window.copyCode = copyCode;
window.quit = quit; window.delAccount = delAccount;

if(!token()){
  $("who").textContent = "未登录";
  $("list").innerHTML = '<div class="card">还没登录。<br><a href="login.html" style="text-decoration:underline;text-underline-offset:3px">用联系方式 + 报名码登录 →</a></div>';
  $("closeBox").style.display = "none";     // 没登录谈不上注销
}else{
  load();
}
</script>
</body>
</html>
