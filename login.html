<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的报名 · 登录 · 2026—2027 辣条杯「天外来物」主题赛</title>
<meta name="description" content="用报名时留的手机号 + 报名码登录，查看并修改自己的辣条杯报名。">
<meta name="author" content="TLSTUDIO × TLDOUBLERSTUDIO">
<link rel="canonical" href="https://tlbs.top/login.html">
<link rel="icon" href="assets/img/logo-tlstudio.png">
<meta name="robots" content="index,follow">
<meta property="og:title" content="我的报名 · 辣条杯「天外来物」主题赛">
<meta property="og:description" content="手机号 + 报名码登录，随时看自己过没过审、改报名资料。">
<meta property="og:url" content="https://tlbs.top/login.html">
<style>
:root{
  --bg:#07080c; --bg-2:#0b0d14; --surface:#10131d; --surface-2:#151928;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#eef1f7; --muted:#8a93a8; --dim:#565e73;
  --blue:#1d9cd8; --cyan:#38e1ff; --violet:#7c5cff;
  --grad:linear-gradient(120deg,#38e1ff 0%,#7c5cff 100%);
  --green:#22c55e; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(620px,92vw);margin:0 auto;padding:34px 0 70px}
header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(7,8,12,.8);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand img{height:26px;width:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.nav ul{display:flex;gap:4px;margin-left:auto;list-style:none}
.nav ul a{display:block;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--text);background:var(--surface-2)}
.kicker{display:inline-flex;align-items:center;gap:9px;font:600 12px/1 ui-monospace,monospace;
  letter-spacing:.2em;color:var(--cyan);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:999px;background:rgba(56,225,255,.06);margin-top:30px}
h1{font-size:clamp(24px,4.4vw,38px);margin:14px 0 8px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:22px}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:26px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
label{font-size:13.5px;font-weight:700;color:#c9d2e0}
input[type=text],input[type=tel]{background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;
  padding:13px 15px;color:var(--text);font-size:19px;letter-spacing:.28em;
  text-align:center;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  text-transform:uppercase;outline:none;transition:border-color .2s;width:100%}
input.tel{text-transform:none;letter-spacing:.06em;font-size:18px}
input::placeholder{letter-spacing:.28em;color:var(--dim)}
input[type=text]:focus,input[type=tel]:focus{border-color:var(--cyan)}
.submit{width:100%;padding:14px;border:none;border-radius:12px;background:var(--grad);
  color:#06121a;font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 18px 60px rgba(56,225,255,.15);transition:.22s}
.submit:hover{transform:translateY(-2px)}
.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{display:none;margin-top:16px;padding:15px 18px;border-radius:11px;font-size:15px;line-height:1.7}
.msg.on{display:block}
.msg.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:#9df3bb}
.msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:#ffb4b4}
.msg.wait{background:rgba(56,225,255,.1);border:1px solid rgba(56,225,255,.4);color:#bfeaf8}
.msg b{display:block;font-size:19px;margin-bottom:5px}
.tips{color:var(--dim);font-size:12.5px;margin-top:15px;text-align:center;line-height:1.9}
.tips a{color:var(--cyan);text-decoration:underline}
.card.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:18px}
@media (max-width:640px){.nav ul{display:none}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in" style="padding:0;width:min(1180px,92vw)">
    <a class="brand" href="index.html">
      <img src="assets/img/logo-tlstudio.png" alt="TLSTUDIO">
      <span>辣条杯 · 天外来物<small>2026—2027 LATIAO CUP</small></span>
    </a>
    <ul>
      <li><a href="index.html#about">赛事</a></li>
      <li><a href="index.html#tasks">任务</a></li>
      <li><a href="index.html#download">下载</a></li>
      <li><a href="map.html">每日地图</a></li>
      <li><a href="signup.html">报名</a></li>
      <li><a href="query.html">查结果</a></li>
      <li><a href="login.html" style="color:var(--cyan)">我的报名</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  <span class="kicker"><i style="width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)"></i>SIGN IN · 我的报名</span>
  <h1>登录<span>我的报名</span></h1>
  <p class="lead">
    用报名时留的<b style="color:var(--text)">手机号</b>加上发给你的
    <b style="color:var(--text)">6 位报名码</b>登录。不用设密码，也不会发短信。
  </p>

  <div class="card">
    <form id="f">
      <div class="field">
        <label>报名时留的手机号</label>
        <input type="tel" id="contact" class="tel" maxlength="20" inputmode="numeric"
               autocomplete="tel" placeholder="例：19127101909">
      </div>
      <div class="field">
        <label>6 位报名码</label>
        <input type="text" id="code" maxlength="6" placeholder="例：483920"
               inputmode="numeric" autocomplete="off" spellcheck="false">
      </div>
      <button class="submit" type="submit" id="btn">登录</button>
    </form>
    <div class="msg" id="msg"></div>
    <p class="tips">
      登录状态会在这台手机上保留 30 天，下次直接就能看。<br>
      只是想快速看一眼过没过审？<a href="query.html">单独输报名码查</a>也行，不用登录。<br>
      还没报名？<a href="signup.html">去报名页</a>　找不到报名码？联系组委会。
    </p>
  </div>

  <p class="card foot">TLSTUDIO × TLDOUBLERSTUDIO 主办 · 结果以组委会通知为准</p>
</div>

<script>
// ★ 基准必须是站点根：下面拼的是 "/latiao/login"。
//   写成 ".../latiao" 会拼成 /latiao/latiao/login（404），登录永远失败。
const API = "https://api.tlstudio.cn/latiao/login";
const $ = id => document.getElementById(id);

function show(kind, title, body){
  const m = $("msg");
  m.className = "msg on " + kind;
  m.innerHTML = "<b>" + title + "</b>" + (body ? String(body).replace(/\n/g, "<br>") : "");
}

var busy = false;
$("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  if(busy) return false;
  busy = true;
  const btn = $("btn");
  btn.disabled = true; btn.textContent = "登录中…";
  show("wait", "正在登录…", "");
  const contact = ($("contact").value || "").trim();
  const code = ($("code").value || "").trim();
  if(!contact || !code){
    show("err", "两项都要填", "手机号 + 6 位报名码，两个都要。");
    btn.disabled = false; btn.textContent = "登录"; busy = false; return false;
  }
  try{
    const r = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({contact: contact, code: code}),
      cache: "no-store"
    });
    const j = await r.json();
    if(j.ok && j.token){
      try{ localStorage.setItem("lt_token", j.token); localStorage.setItem("lt_contact", contact); }catch(e){}
      show("ok", "登录成功", "正在打开你的报名…");
      setTimeout(function(){ location.href = "me.html"; }, 400);
      return false;
    }
    btn.disabled = false; btn.textContent = "登录"; busy = false;
    if(r.status === 429){
      show("err", "尝试次数太多", "为了防别人乱猜，一小时后再试一次。");
    }else{
      show("err", "登录不了", (j.error || "手机号或报名码不对。") + "\n确认一下：报名码是 6 位纯数字，手机号要和报名时留的完全一致。");
    }
  }catch(e){
    btn.disabled = false; btn.textContent = "登录"; busy = false;
    show("err", "网络异常", "请检查网络后重试，或直接联系组委会。");
  }
  return false;
});

// 已经登录过就直接跳过去，省得再输一遍；这台机器报过名的，手机号自动带上
try{
  if(localStorage.getItem("lt_token")){ location.replace("me.html"); }
  else{
    const s = localStorage.getItem("lt_signup");
    if(s){ const d = JSON.parse(s); if(d && d.contact) $("contact").value = d.contact; }
  }
}catch(e){}
</script>
</body>
</html>
