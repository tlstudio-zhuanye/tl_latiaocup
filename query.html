<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>查审核结果 · 2026—2027 辣条杯「天外来物」主题赛</title>
<meta name="description" content="输入报名码，查看辣条杯天外来物主题赛报名是否通过审核。">
<meta name="author" content="TLSTUDIO × TLDOUBLERSTUDIO">
<link rel="canonical" href="https://tlbs.top/query.html">
<link rel="icon" href="assets/img/logo-tlstudio.png">
<meta name="robots" content="index,follow">
<meta property="og:title" content="查审核结果 · 辣条杯「天外来物」主题赛">
<meta property="og:description" content="报名后凭报名码，随时查看自己过没过审。">
<meta property="og:url" content="https://tlbs.top/query.html">
<style>
:root{
  --bg:#ffffff; --bg-2:#f5f5f5; --surface:#ffffff; --surface-2:#eeeeee;
  --line:#e7e7e7; --line-2:#c9c9c9;
  --text:#111111; --muted:#5f5f5f; --dim:#737373;
  --blue:#111111; --cyan:#111111; --violet:#3a3a3a;
  --grad:linear-gradient(120deg,#111111 0%,#3a3a3a 100%);
  --green:#111111; --red:#111111;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:min(620px,92vw);margin:0 auto;padding:34px 0 70px}
header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px}
.brand img{height:26px;width:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.nav ul{display:flex;gap:4px;margin-left:auto;list-style:none}
.nav ul a{display:block;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--text);background:var(--surface-2)}
.kicker{display:inline-flex;align-items:center;gap:9px;font:600 12px/1 ui-monospace,monospace;
  letter-spacing:.2em;color:var(--cyan);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.06);margin-top:30px}
.kicker i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);transform:translateY(.125em)}
h1{font-size:clamp(26px,4.6vw,38px);margin:14px 0 8px;font-weight:600;letter-spacing:-.01em}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:14.5px;margin-bottom:22px}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:26px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
label{font-size:13.5px;font-weight:700;color:#3a3a3a}
input[type=text]{background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;
  padding:13px 15px;color:var(--text);font-size:19px;letter-spacing:.28em;
  text-align:center;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  text-transform:uppercase;outline:none;transition:border-color .2s;width:100%}
input[type=text]::placeholder{letter-spacing:.28em;color:var(--dim)}
input[type=text]:focus{border-color:var(--cyan)}
.submit{width:100%;padding:14px;border:none;border-radius:12px;background:var(--grad);
  color:#ffffff;font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.10);transition:.22s}
.submit:hover{transform:translateY(-2px)}
.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{display:none;margin-top:16px;padding:15px 18px;border-radius:11px;font-size:15px;line-height:1.7}
.msg.on{display:block}
.msg.ok{background:#111111;color:#ffffff;border:1px solid #111111}
.msg.err{background:#ffffff;border:1.5px solid #111111;color:#111111}
.msg.wait{background:#f0f0f0;border:1px solid #c9c9c9;color:#5f5f5f}
.msg b{display:block;font-size:19px;margin-bottom:5px}
.si{width:1em;height:1em;vertical-align:-.14em;flex:0 0 auto}
.tips{color:var(--dim);font-size:12.5px;margin-top:15px;text-align:center}
.tips a{color:#111111;text-decoration:underline}
.tips b{color:var(--muted)}
.card.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:18px}
@media (max-width:640px){.nav ul{display:none}}


/* ===== nav 修复（2026-11 起各页统一） =====
   症状：窗口一窄，品牌被导航挤成四行（天外来物 / 2026—2027 / LATIAO / CUP），
         导航自己也折成两排，而 .nav-in 又写死 62px 高 —— 溢出的字直接压到首屏上。
   做法：品牌固定成一块、不缩不换行；导航不换行也不横滑（横滑会把「报名」藏到屏幕外），
         放不下就整体折到品牌下一行；头部高度改成 min-height，永远不会顶穿下面的内容。 */
.nav-in{height:auto;min-height:62px;flex-wrap:nowrap;align-items:center;padding:9px 0}
.brand{flex:0 0 auto;white-space:nowrap;line-height:1.15}
.brand img{flex:0 0 auto}
.brand span{white-space:nowrap}
.brand small{white-space:nowrap;margin-top:2px;font-size:10.5px;letter-spacing:.08em}
.nav ul{flex-wrap:nowrap;min-width:0;justify-content:flex-end}
.nav ul li{flex:0 0 auto}
.nav ul a{white-space:nowrap}
@media (max-width:1100px){
  .nav-in{gap:8px}
  .nav ul{gap:2px}
  .nav ul a{padding:7px 9px;font-size:13px}
  .brand span{font-size:14px}
}
@media (max-width:900px){
  .nav ul a{padding:6px 7px;font-size:12.5px}
  .brand span{font-size:13px}
  .brand img{height:22px}
  .brand small{font-size:9.5px;letter-spacing:.04em}
}
/* ★ 手机上：品牌第一行，导航整体折到第二行 —— 一项不藏、一格不滑 */
@media (max-width:780px){
  .nav-in{flex-wrap:wrap;min-height:0;padding:8px 0 6px;gap:0 8px;row-gap:4px}
  .brand{padding:2px 0}
  .brand span{font-size:13.5px}
  .brand small{display:none}
  /* 以前这里（640px）是 display:none，手机等于没导航，改回可见 */
  .nav ul{display:flex;flex:1 1 100%;margin-left:0;justify-content:flex-start;
          flex-wrap:wrap;gap:0}
  .nav ul a{padding:6px 7px;font-size:12.5px}
}
@media (max-width:420px){
  .brand span{font-size:12.5px}
  .brand img{height:20px}
  .nav ul a{padding:5px 5px;font-size:12px}
}
/* 统一标题字重 */
h1,h2,h3,h4{font-weight:600}
/* 导航统一：当前页高亮 / 报名 CTA */
.nav ul a.cta{color:var(--text);font-weight:700}
.nav ul a.on{color:var(--text);background:var(--surface-2)}
header.nav .nav-in{width:min(1180px,92vw);margin:0 auto}
/* 品牌 logo 跟随黑白主题：原图是青色，站内统一去色（不改原图，随时可撤） */
.brand img{filter:grayscale(1) contrast(1.06)}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html">
      <img src="assets/img/logo-tlstudio.png" alt="TLSTUDIO">
      <span>辣条杯 · 天外来物<small>2026—2027 LATIAO CUP</small></span>
    </a>
    <ul>
      <li><a href="index.html#about">赛事</a></li>
      <li><a href="index.html#rules">规则</a></li>
      <li><a href="index.html#tasks">任务</a></li>
      <li><a href="index.html#score">计分</a></li>
      <li><a href="index.html#download">下载</a></li>
      <li><a href="map.html">每日地图</a></li>
      <li><a href="query.html" class="on">查结果</a></li>
      <li><a href="login.html">我的报名</a></li>
      <li><a href="signup.html" class="cta">报名 →</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  <span class="kicker"><i></i>CHECK · 凭报名码查结果</span>
  <h1>查<span>审核结果</span></h1>
  <p class="lead">
    提交报名后会得到一串<b style="color:var(--text)">报名码</b>（6 位数字）。
    输入它就能看到自己<b style="color:var(--text)">审核中 / 已通过 / 未通过 / 已退出</b>。
  </p>

  <div class="card">
    <div class="field">
      <label>报名码</label>
      <input type="text" id="code" maxlength="8" placeholder="例：483920" autocomplete="off"
             inputmode="numeric" spellcheck="false">
    </div>
    <button class="submit" type="button" id="btn">查询审核结果</button>
    <div class="msg" id="msg"></div>
    <p class="tips">
      报名码在报名成功页，也会发到你留的联系方式。<br>
      找不到报名码？点 <a href="signup.html">回到报名页</a> 或联系组委会。
    </p>
  </div>

  <p class="card foot">TLSTUDIO × TLDOUBLERSTUDIO 主办 · 结果以组委会通知为准</p>
</div>

<script>
// ★ 基准必须是站点根：下面拼的是 "/latiao/query"。
//   写成 ".../latiao" 会拼成 /latiao/latiao/query（404），查询永远失败。
const API_BASE = "https://api.tlstudio.cn";
const QUERY = API_BASE + "/latiao/query";
const $ = id => document.getElementById(id);

const fmtTime = function(ts){
  if(!ts) return "";
  const d = new Date(ts), p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
};

async function query(){
  const input = $("code");
  const code = (input.value || "").trim().toUpperCase();
  const msg = $("msg"), btn = $("btn");
  if(!code){ show("err", "请先输入报名码", "报名码是 6 位数字，提交报名后会给到。"); return; }
  msg.className = "msg";
  msg.textContent = "正在查询…";
  btn.disabled = true; btn.textContent = "查询中…";
  try{
    const r = await fetch(QUERY + "?code=" + encodeURIComponent(code), { cache: "no-store" });
    const j = await r.json();
    if(!j.ok){ show("err", "查询失败", "服务暂时不可用，稍后再试，或直接联系组委会。"); return; }
    if(!j.found){
      show("err", "查不到这个报名码",
        "报名码是 6 位数字、不会以 0 开头，请核对有没有少输一位。\n" +
        "确认无误仍查不到，请先重新提交报名拿到新码，或联系组委会核实。");
      return;
    }
    localStorage.setItem("lt_code", code);   // 记住这次查的码，下次自动带出来
    const team = j.team || "";
    const who = team ? "队伍「" + team + "」" : "你的报名";
    const when = fmtTime(j.ts) ? "（提交于 " + fmtTime(j.ts) + "）" : "";
    if(j.st === "ok"){
      show("ok", "审核通过",
        who + "已通过审核" + when + "。开赛时间、场地与分组将另行通知，请留意你留的联系方式。");
    }else if(j.st === "out"){
      show("err", "已退出比赛",
        who + "已退出本次比赛" + when + "，报名信息已清除。\n" +
        "退出不能恢复 —— 想再参加请重新报名，会拿到新的报名码。\n" +
        "有任何问题联系组委会。");
    }else if(j.st === "del"){
      show("err", "已注销",
        who + "的报名已注销，资料已清除" + when + "。\n" +
        "注销不能恢复 —— 想再参加请重新报名，会拿到新的报名码。\n" +
        "有任何问题联系组委会。");
    }else if(j.st === "rej"){
      show("err", "未通过审核",
        (j.note ? j.note + "。" : "组委会审核后未通过本次报名。") +
        who + "未通过。想参加可以核对资料后重新提交报名，报名码会更新。");
    }else{
      show("wait", "审核中",
        who + "已提交，组委会正在核对" + when + "。\n" +
        "审核结果出来后本页会显示，也可以留意组委会通知。");
    }
  }catch(e){
    show("err", "网络异常", "暂时连不上服务器，请稍后重试，或联系组委会。");
  }finally{
    btn.disabled = false; btn.textContent = "查询审核结果";
  }
}

function show(kind, title, note){
  const msg = $("msg");
  msg.className = "msg on " + kind;
  msg.innerHTML = "";
  const b = document.createElement("b");
  b.innerHTML = (kind === "ok" ? '<svg class="si" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 8.6l3.1 3.1 6.5-7.1"/></svg>' : kind === "err" ? '<svg class="si" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>' : '') + '<span class="tt"></span>';
  b.querySelector(".tt").textContent = title;
  msg.appendChild(b);
  const s = document.createElement("span");
  s.textContent = note;
  s.style.whiteSpace = "pre-line";
  msg.appendChild(s);
}

// 回车即查
$("code").addEventListener("keydown", function(e){
  if(e.key === "Enter") query();
});
$("btn").addEventListener("click", query);

// 本机存过报名码就自动填进去（帮家人代查时改一下即可）
(function(){
  try{
    const saved = localStorage.getItem("lt_code");
    if(saved && !$("code").value) $("code").value = saved.trim().toUpperCase();
  }catch(e){}
})();
</script>
</body>
</html>
