<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>报名参赛 · 2026—2027 辣条杯「天外来物」主题赛</title>
<meta name="description" content="辣条杯天外来物主题赛报名：队伍名称、2 名选手 + 1 名指导教练，在线填表即刻报名。">
<meta name="author" content="TLSTUDIO × TLDOUBLERSTUDIO">
<link rel="canonical" href="https://tlbs.top/signup.html">
<link rel="icon" href="assets/img/logo-tlstudio.png">
<meta name="robots" content="index,follow">
<meta property="og:title" content="报名参赛 · 辣条杯「天外来物」主题赛">
<meta property="og:description" content="在线填表即刻报名，2 名选手 + 1 名指导教练为一队。">
<meta property="og:url" content="https://tlbs.top/signup.html">
<style>
:root{
  --bg:#07080c; --bg-2:#0b0d14; --surface:#10131d; --surface-2:#151928;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#eef1f7; --muted:#8a93a8; --dim:#565e73;
  --blue:#1d9cd8; --cyan:#38e1ff; --violet:#7c5cff;
  --grad:linear-gradient(120deg,#38e1ff 0%,#7c5cff 100%);
  --green:#22c55e; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.wrap{width:min(760px,92vw);margin:0 auto;padding:36px 0 60px}
header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(7,8,12,.8);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand img{height:26px;width:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.nav ul{display:flex;gap:4px;margin-left:auto;list-style:none}
.nav ul a{display:block;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.nav ul a:hover{color:var(--text);background:var(--surface-2)}
.kicker{display:inline-flex;align-items:center;gap:9px;font:600 12px/1 ui-monospace,monospace;
  letter-spacing:.2em;color:var(--cyan);border:1px solid var(--line-2);
  padding:8px 14px;border-radius:999px;background:rgba(56,225,255,.06);margin-top:26px}
h1{font-size:clamp(26px,4.6vw,42px);margin:16px 0 8px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:15px;margin-bottom:26px}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));
  border:1px solid var(--line);border-radius:16px;padding:26px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13.5px;font-weight:700;color:#c9d2e0}
label b{color:var(--cyan)}
label small{color:var(--dim);font-weight:500}
input[type=text],input[type=tel],textarea{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;
  padding:11px 13px;color:var(--text);font-size:14.5px;font-family:inherit;outline:none;
  transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--cyan)}
textarea{resize:vertical;min-height:74px}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:7px;font-weight:500;font-size:14px;
  border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;cursor:pointer;
  background:var(--bg-2);transition:.2s}
.radios label:has(input:checked){border-color:var(--cyan);color:var(--cyan);
  background:rgba(56,225,255,.07)}
.radios input{accent-color:var(--cyan)}
.submit{margin-top:22px;width:100%;padding:14px;border:none;border-radius:12px;
  background:var(--grad);color:#06121a;font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 18px 60px rgba(56,225,255,.15);transition:.22s}
.submit:hover{transform:translateY(-2px)}
.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.msg{display:none;margin-top:16px;padding:13px 16px;border-radius:10px;font-size:14.5px}
.msg.ok{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:var(--green)}
.msg.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:var(--red)}
.msg.rej{display:none;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.55);
  color:#ffb4b4;line-height:1.6}
.msg.rej.on{display:block}
.msg.rej b{display:block;font-size:16px;color:#ff8f8f;margin-bottom:3px}
.tips{color:var(--dim);font-size:12.5px;margin-top:14px}
.tips b{color:var(--muted)}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}.nav ul{display:none}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in" style="padding:0;width:min(1180px,92vw)">
    <a class="brand" href="index.html">
      <img src="assets/img/logo-tlstudio.png" alt="TLSTUDIO">
      <span>辣条杯 · 天外来物<small>2026—2027 LATIAO CUP</small></span>
    </a>
    <ul>
      <li><a href="index.html#about">赛事</a></li>
      <li><a href="index.html#tasks">任务</a></li>
      <li><a href="index.html#download">下载</a></li>
      <li><a href="map.html">每日地图</a></li>
      <li><a href="signup.html" style="color:var(--cyan)">报名</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  <span class="kicker"><i style="width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)"></i>SIGN UP · 报名通道已开启</span>
  <h1>报名<span>参赛</span></h1>
  <p class="lead">
    队伍编制：<b style="color:var(--text)">2 名选手 + 1 名指导教练</b>。
    提交后即完成预报名，开赛时间与比赛安排将通过你留下的联系方式另行通知。
  </p>

  <div class="card">
    <div class="msg rej" id="rejbar">
      <b>您已被拒签，请尝试再次申请</b>
      <span id="rejnote">组委会审核后未通过本次报名。</span>
    </div>
    <form id="fm" onsubmit="return doSubmit(event)">
      <div class="fgrid">
        <div class="field full">
          <label>队伍名称 <b>*</b></label>
          <input type="text" name="team" maxlength="40" required placeholder="例：星辰战队">
        </div>
        <div class="field">
          <label>选手 1 姓名 <b>*</b></label>
          <input type="text" name="member1" maxlength="20" required placeholder="必填">
        </div>
        <div class="field">
          <label>选手 2 姓名 <small>（选填）</small></label>
          <input type="text" name="member2" maxlength="20" placeholder="单人就留空">
        </div>
        <div class="field">
          <label>指导教练姓名 <b>*</b></label>
          <input type="text" name="coach" maxlength="20" required placeholder="必填">
        </div>
        <div class="field">
          <label>联系电话 / 微信 <b>*</b></label>
          <input type="tel" name="contact" maxlength="40" required placeholder="用于接收开赛通知">
        </div>
        <div class="field full">
          <label>器材准备 <b>*</b></label>
          <div class="radios">
            <label><input type="radio" name="gear" value="自备鲸鱼机器人器材" checked>自备鲸鱼机器人器材</label>
            <label><input type="radio" name="gear" value="租借">需租借（先登记，数量有限）</label>
          </div>
        </div>
        <div class="field full">
          <label>备注 <small>（选填）</small></label>
          <textarea name="note" maxlength="200" placeholder="想问的问题、期望的开赛时间、队友情况等"></textarea>
        </div>
      </div>
      <button class="submit" type="submit" id="btn">提交报名</button>
      <div class="msg" id="msg"></div>
      <p class="tips">
        提交即视为同意：报名信息仅用于本届赛事组织与通知，不作他用。<br>
        <b>填错也不用担心</b>——重新提交一次即可，组委会以最新一条为准。
      </p>
    </form>
  </div>
</div>

<script>
const API = "https://api.tlstudio.cn/latiao/signup";
// ★ 基准必须是站点根，不能带 /latiao：下面拼的是 "/latiao/status"，
//   写成 ".../latiao" 会拼成 /latiao/latiao/status（404），拒签横幅就永远不亮。
const API_BASE = "https://api.tlstudio.cn";
const $ = id => document.getElementById(id);

// ---------- 拒签自查：本机存过报名人 → 打开页面就显示「您已被拒签，请尝试再次申请」 ----------
function myContact(){
  try{
    const raw = localStorage.getItem("lt_signup");
    if(raw){ const d = JSON.parse(raw); if(d && d.contact) return d; }
  }catch(e){}
  return null;
}

async function checkReject(silent){
  const me = myContact();
  if(!me) return;
  const bar = $("rejbar");
  try{
    const q = new URLSearchParams({ contact: me.contact || "", team: me.team || "" });
    const r = await fetch(API_BASE + "/latiao/status?" + q.toString(), { cache: "no-store" });
    const j = await r.json();
    if(j.rejected){
      bar.classList.add("on");
      const t = j.team ? "队伍「" + j.team + "」" : "你的报名";
      $("rejnote").textContent =
        (j.note ? j.note + "。" : "组委会审核后未通过本次报名。") +
        t + "已被拒签，请核对资料后重新提交，提交后即恢复报名。";
    }else{
      bar.classList.remove("on");
    }
  }catch(e){
    if(!silent) bar.classList.remove("on");
  }
}
checkReject(true);

async function doSubmit(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const data = Object.fromEntries(fd.entries());
  const btn = $("btn"), msg = $("msg");
  btn.disabled = true; btn.textContent = "正在提交…";
  msg.className = "msg"; msg.textContent = "";
  try{
    const r = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data),
    });
    const j = await r.json();
    if(j.ok){
      msg.className = "msg ok";
      msg.textContent = "✔ 报名成功！队伍「" + (data.team||"") + "」已登记，开赛安排将另行通知。欢迎截图保存这条提示。";
      $("rejbar").classList.remove("on");      // 再次申请成功 → 拒签提示收起，刷新后也不会再弹回来
      btn.textContent = "已提交";
      ev.target.querySelectorAll("input,textarea").forEach(el=>el.disabled=true);
      try{ localStorage.setItem("lt_signup", JSON.stringify(data)); }catch(e){}
    }else{
      msg.className = "msg err";
      msg.textContent = "✖ " + (j.error || "提交失败，请稍后重试");
      btn.disabled = false; btn.textContent = "提交报名";
    }
  }catch(e){
    msg.className = "msg err";
    msg.textContent = "✖ 网络异常：请检查网络后重试，或直接联系组委会";
    btn.disabled = false; btn.textContent = "提交报名";
  }
  return false;
}
</script>
</body>
</html>
